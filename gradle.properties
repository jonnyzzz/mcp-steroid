org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true

# kotlinx pins for modules that link into the ij-plugin runtime classpath.
# At runtime the IDE classloader serves the bundled `intellij.libraries.kotlinx.*.jar`
# variants; these values must equal the BASE version of what IDE 261 ships
# (after stripping the JetBrains `-intellij-N` fork suffix for coroutines).
# Enforced by `:ij-plugin:test` -> `KotlinxBundledVersionTest` against every
# entry in `McpSteroidIdeTargets.verifierTargets`.
# See also 'gradle/libs.versions.toml'
mcp.kotlinx.serialization.version=1.9.0

# IPGP 2.18 composes the test-IDE classpath from the IDE's product-info bundled-plugin
# entries. That pulls the Vue.js plugin onto the :ij-plugin:test classpath, where
# VueLspServerPackageDescriptor.<clinit> fails (it expects <ide>/plugins/vue; the IDE
# ships plugins/vuejs-plugin) and every VFS refresh dies with TestLoggerAssertionError.
# Exclude it. NOTE: this property REPLACES the IPGP default, so the first four entries
# repeat the default value (see GradleProperties.TestIdeBundledPluginsClasspathExcludes).
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue
