[versions]
kotlin = "2.3.20"
kotlin-build-tools-api = "2.4.0"
kotlinx-coroutines = "1.10.2"
# kotlinx pins for modules that link into the ij-plugin runtime classpath.
# At runtime the IDE classloader serves the bundled `intellij.libraries.kotlinx.*.jar`
# variants; these values must equal the BASE version of what IDE 261 ships
# (after stripping the JetBrains `-intellij-N` fork suffix for coroutines).
# Enforced by `:ij-plugin:test` -> `KotlinxBundledVersionTest` against every
# entry in `McpSteroidIdeTargets.verifierTargets`.
undercouch-download = "5.7.0"

[libraries]
kotlin-buildTools-api = { group = "org.jetbrains.kotlin", name = "kotlin-build-tools-api", version.ref = "kotlin-build-tools-api" }
kotlin-buildTools-compat = { group = "org.jetbrains.kotlin", name = "kotlin-build-tools-compat", version.ref = "kotlin-build-tools-api" }
kotlin-buildTools-impl = { group = "org.jetbrains.kotlin", name = "kotlin-build-tools-impl", version.ref = "kotlin" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
download = { id = "de.undercouch.download", version.ref = "undercouch-download" }
