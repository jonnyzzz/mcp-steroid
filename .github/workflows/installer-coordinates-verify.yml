# Verifies the pinned installer coordinates against reality: :site-gen:generateInstaller downloads every
# pinned JDK 25 archive (the url+sha256 list in site-gen/build.gradle.kts) and re-hashes each — failing on
# any mismatch (a corrupt download, or — for Corretto's immutable versioned URLs — a maintainer-visible
# drift) — plus resolves the latest devrig release, then renders install.sh/ps1. The pinned versions are
# intentionally HARDCODED: this is an integrity guard, NOT an auto-bumper. On a failure a maintainer
# updates the url+sha256 in site-gen/build.gradle.kts by hand.
#
# TODO (TASKS.md Block S): fold this validation into the daily website build so there is a SINGLE GH action.
name: installer-coordinates-verify

on:
  schedule:
    # Weekly — the pinned vendor artifacts are immutable, so a daily re-download would just re-fetch
    # ~1 GB of identical bytes. Bump to a daily cron if drift detection needs to be tighter.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-coordinates-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # generateInstaller downloads + re-hashes the 5 JDKs AND resolves + downloads the latest devrig release
      # (resolveLatestDevrigZipUrl), so a vanished/!200 devrig asset already fails this one step — no separate
      # devrig URL check needed (the old one read the now-deleted devrig-coordinates.json).
      - name: Verify pinned JDK coordinates + devrig (download + sha256 re-hash, render install scripts, fail on drift)
        run: ./gradlew :site-gen:generateInstaller --no-daemon --info --stacktrace
