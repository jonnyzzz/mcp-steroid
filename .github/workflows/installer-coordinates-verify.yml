# Verifies the pinned installer coordinates against reality: downloads every JDK in
# jdk-downloader/jdk25-pinned.json (via :jdk-downloader) and HEADs the devrig package URL, asserting the
# URLs still resolve and each download's bytes match the sha256 FETCHED FROM THE VENDOR (per the entry's
# sha256Url — no hardcoded sha; generateJdkCoordinates fails the build on a mismatch). A mismatch means a
# corrupt download OR (for Corretto, whose sha256Url tracks the latest build) a newer JDK 25 build shipped.
# The pinned JDK 25 versions are intentionally HARDCODED — so this is an integrity guard, NOT an
# auto-bumper: on a failure a maintainer updates jdk25-pinned.json (version + url) by hand.
#
# Future enhancement (intentionally not built yet): auto-detect a newer BUILD of the same JDK 25 major
# via the vendor metadata APIs (Corretto GitHub releases / Azul metadata) and open a refresh PR.
name: installer-coordinates-verify

on:
  schedule:
    # Weekly — the pinned vendor artifacts are immutable, so a daily re-download would just re-fetch
    # ~1 GB of identical bytes. Bump to a daily cron if drift detection needs to be tighter.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-coordinates-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Verify pinned JDK coordinates (download + sha256 cross-check, fails on drift)
        run: ./gradlew :installer-gen:generateJdkCoordinates --no-daemon

      - name: Verify the devrig package URL is reachable
        run: |
          url=$(jq -r '.devrig.url' website/installer/devrig-coordinates.json)
          case "$url" in
            *PLACEHOLDER*) echo "devrig-coordinates.json is still the release-time placeholder — skipping URL check"; exit 0 ;;
          esac
          # Ranged GET of the first byte, not HEAD: GitHub release URLs 302-redirect to a signed,
          # expiring objects.githubusercontent.com URL where HEAD can 403/405.
          echo "GET (first byte) $url"
          curl -fsSL -o /dev/null -r 0-0 "$url"
